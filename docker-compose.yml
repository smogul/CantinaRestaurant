services:
  api:
    build:
      context: .
      dockerfile: src/CantinaApi/Dockerfile
    # .env.example supplies placeholders so a fresh clone starts; any value set in .env overrides it.
    env_file:
      - path: .env.example
      - path: .env
        required: false
    environment:
      Seed__Enabled: "true"
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    env_file:
      - path: .env.example
      - path: .env
        required: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres-data:
